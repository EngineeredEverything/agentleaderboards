    let codingModels = AGENTS.filter(a => {

    let cardsHTML = '';

            const score = m.benchmarks[b];

            `<div class="flex justify-between py-1 border-b border-gray-600 last:border-0"><span class="text-gray-400 text-xs">${name}</span><span class="font-bold text-sm">${score}</span></div>`
        ).join('');

        cardsHTML += `
        <div class="bg-gray-800 rounded-2xl p-6 border ${i === 0 ? 'border-yellow-500' : 'border-gray-700'} mb-4">
            <div class="flex items-start justify-between mb-4">
                <div class="flex items-start gap-4">
                    <div class="bg-gray-700 rounded-full w-14 h-14 flex items-center justify-center text-xl font-bold ${i === 0 ? 'text-yellow-400' : i < 3 ? 'text-purple-400' : 'text-gray-400'}">#${i + 1}</div>
                    <div>
                        <h3 class="text-xl font-bold">${m.name}</h3>
                        <p class="text-gray-400 text-sm">${m.provider} · ${m.released}</p>
                        <p class="text-gray-300 text-sm mt-1">${m.description}</p>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-3xl font-bold text-purple-400">${m.score}</div>
                    <div class="text-xs text-gray-400">Overall Score</div>
                </div>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
                <div class="bg-gray-700 rounded-lg p-4">
                    <h4 class="text-xs text-gray-400 mb-2 font-semibold uppercase">Coding Benchmarks</h4>
                    ${benchRows || allBenchRows}
                </div>
                <div class="bg-gray-700 rounded-lg p-4">
                    <h4 class="text-xs text-gray-400 mb-2 font-semibold uppercase">Details</h4>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between"><span class="text-gray-400">Pricing</span><span>${m.pricing}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">Speed</span><span>${m.speed}</span></div>
                        <div class="flex justify-between"><span class="text-gray-400">Context</span><span>${m.context}</span></div>
                    </div>
                </div>
            </div>
            <div class="mt-4 flex gap-3">
                <a href="compare.html?agent=${m.id}" class="text-sm text-purple-400 hover:underline"><i class="fas fa-balance-scale mr-1"></i>Compare</a>
                <a href="calculator.html" class="text-sm text-gray-400 hover:underline"><i class="fas fa-calculator mr-1"></i>Cost Calculator</a>
            </div>
        </div>`;
    });

    document.getElementById('content').innerHTML = `
