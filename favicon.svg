  <!-- 3rd place -->
  <rect x="22" y="19" width="7" height="9" rx="1.5" fill="#64748b"/>
  
  <!-- #1 star / crown on top of 1st place bar -->
  <polygon points="16,4 17.2,7.6 21,7.6 18,9.8 19.1,13.4 16,11.2 12.9,13.4 14,9.8 11,7.6 14.8,7.6" fill="#fbbf24"/>
