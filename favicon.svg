<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  
  <!-- Podium bars -->
  <!-- 2nd place -->
  <rect x="3" y="16" width="7" height="12" rx="1.5" fill="#94a3b8"/>
  <!-- 1st place (tallest, gold) -->
